<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berkcan Karabulut - Portfolio</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React ve ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- Babel (JSX için) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-gray-100 font-sans">
    <!-- React kökü -->
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        return (
          <div>
            {/* Navbar */}
            <nav className="bg-blue-600 text-white p-4 flex justify-between">
              <h1 className="text-xl font-bold">Berkcan Karabulut</h1>
              <div className="space-x-4">
                <a href="#about" className="hover:underline">Hakkımda</a>
                <a href="#projects" className="hover:underline">Projeler</a>
                <a href="#contact" className="hover:underline">İletişim</a>
              </div>
            </nav>

            {/* Hero */}
            <section className="text-center py-16 bg-gradient-to-r from-blue-500 to-purple-600 text-white">
              <h2 className="text-4xl font-bold mb-4">Merhaba 👋</h2>
              <p className="text-lg">Ben Berkcan Karabulut, Unity Developer & Oyun Geliştirici</p>
              <a
                href="cv.pdf"
                download
                className="mt-6 inline-block px-6 py-2 bg-white text-blue-600 font-semibold rounded-lg shadow hover:bg-gray-200"
              >
                📄 CV İndir
              </a>
            </section>

            {/* Hakkımda */}
            <section id="about" className="max-w-3xl mx-auto p-8">
              <h3 className="text-2xl font-bold mb-4">Hakkımda</h3>
              <p className="text-gray-700 leading-relaxed">
                5+ yıldır oyun geliştiriyorum. Unity ile 50’den fazla oyun
                geliştirdim ve LiveOps deneyimim var. Şu anda mobil ve PC oyunları üzerine
                çalışıyorum. Kod kalitesi, temiz mimari ve yaratıcı oyun sistemleri
                geliştirmeye önem veriyorum.
              </p>
            </section>

            {/* Projeler */}
            <section id="projects" className="bg-gray-200 py-12">
              <div className="max-w-5xl mx-auto px-6">
                <h3 className="text-2xl font-bold mb-8 text-center">Projelerim</h3>
                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                  <ProjectCard
                    title="🎰 Wheel of Fortune"
                    desc="Unity ile geliştirilmiş şans oyunu"
                    link="https://github.com/berkcankarabulut/WheelOfFortune"
                  />
                  <ProjectCard
                    title="🧩 Match 3 Puzzle"
                    desc="Candy Crush tarzı Match3 oyunu"
                    link="https://github.com/berkcankarabulut/Match3Game"
                  />
                  <ProjectCard
                    title="🛒 Market Simulator"
                    desc="Kıyamet sonrası market işletme oyunu"
                    link="https://github.com/berkcankarabulut/MarketSim"
                  />
                </div>
              </div>
            </section>

            {/* İletişim */}
            <section id="contact" className="max-w-3xl mx-auto p-8 text-center">
              <h3 className="text-2xl font-bold mb-4">İletişim</h3>
              <p className="text-gray-700 mb-4">
                Benimle iletişime geçmek için:
              </p>
              <a
                href="mailto:berkcankarabulut@gmail.com"
                className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
              >
                📧 Mail Gönder
              </a>
            </section>

            {/* Footer */}
            <footer className="bg-blue-600 text-white text-center py-4 mt-12">
              © {new Date().getFullYear()} Berkcan Karabulut. Tüm Hakları Saklıdır.
            </footer>
          </div>
        );
      }

      function ProjectCard({ title, desc, link }) {
        return (
          <div className="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
            <h4 className="text-xl font-semibold mb-2">{title}</h4>
            <p className="text-gray-600 mb-4">{desc}</p>
            <a
              href={link}
              target="_blank"
              className="text-blue-600 font-medium hover:underline"
            >
              GitHub'da Gör
            </a>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
